<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Mari</title>
  <meta name="description" content="Живое меню кафе и пекарни La Mari">
  <meta name="theme-color" content="#0d0b0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/home.css">
</head>

<body>

  <!-- LUXURY PRELOADER -->
  <div id="preloader">
    <div class="pl-glow"></div>
    <div class="pl-content">
      <img src="img/logo_lamari.png" alt="La Mari" class="pl-logo">
      <div class="pl-track">
        <div class="pl-bar"></div>
      </div>
    </div>
  </div>

  <div class="home-container">

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="video-wrapper">
      <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto">
        <source src="video/video_lamari.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SUBTLE VIGNETTES -->
    <div class="home-top-vignette"></div>
    <div class="home-vignette"></div>

    <!-- TOP BAR (LOGO TOP-LEFT) -->
    <header class="home-top-bar">
      <img src="img/logo_lamari.png" alt="La Mari" class="home-logo">
    </header>

    <!-- BOTTOM ACTION AREA -->
    <main class="home-bottom-area">
      <a href="menu.html" class="enter-menu-btn" id="enterMenuBtn" aria-label="Меню">
        <span class="btn-text">Меню | Menu</span>
      </a>
    </main>

  </div>

  <script>
    // 1. Динамическая высота вьюпорта для iOS Safari
    function setVH() {
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setVH);
    }
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => {
      setTimeout(setVH, 100);
      setTimeout(setVH, 300);
    });

    // 2. Старт видео строго с начала (с 0.0 сек) после растворения прелоадера
    const bgVideo = document.getElementById('bgVideo');
    const preloader = document.getElementById('preloader');
    const enterMenuBtn = document.getElementById('enterMenuBtn');
    let preloaderDismissed = false;

    // Подготовка первого кадра под прелоадером без ухода вперед
    if (bgVideo) {
      const prepareFirstFrame = () => {
        try { bgVideo.currentTime = 0; } catch (e) {}
        bgVideo.classList.add('ready');
      };
      if (bgVideo.readyState >= 2) {
        prepareFirstFrame();
      } else {
        bgVideo.addEventListener('loadeddata', prepareFirstFrame, { once: true });
        bgVideo.addEventListener('canplay', prepareFirstFrame, { once: true });
      }
    }

    function revealVideo() {
      if (preloaderDismissed) return;
      preloaderDismissed = true;

      if (bgVideo) {
        try {
          bgVideo.currentTime = 0;
        } catch (e) {}
        bgVideo.play().catch(() => {});
        bgVideo.classList.add('ready');
      }

      if (preloader) {
        preloader.classList.add('hide');
      }
    }

    function startPreloader() {
      preloaderDismissed = false;
      if (preloader) {
        preloader.classList.remove('hide');
        preloader.style.display = '';
      }
      if (bgVideo) {
        try {
          bgVideo.pause();
          bgVideo.currentTime = 0;
        } catch (e) {}
      }
      setTimeout(revealVideo, 1300);
    }

    // Роскошный прелоадер и синхронный старт видео строго с первого кадра
    window.addEventListener('load', startPreloader);
    setTimeout(revealVideo, 2800);

    // Гарантированный показ прелоадера при возврате из меню (BFCache / История)
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        startPreloader();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && bgVideo && bgVideo.paused && preloaderDismissed) {
        bgVideo.play().catch(() => {});
      }
    });

    // Бесшовный мягкий переход в меню без черного экрана
    if (enterMenuBtn) {
      enterMenuBtn.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.style.transition = 'opacity 0.2s ease-out';
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = enterMenuBtn.href;
        }, 190);
      });
    }
  </script>
</body>

</html>
