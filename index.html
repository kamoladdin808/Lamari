<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Mari</title>
  <meta name="description" content="Живое меню кафе и пекарни La Mari">
  <meta name="theme-color" content="#0d0b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" href="img/logo_lamari.png">
  <link rel="apple-touch-icon" href="img/logo_lamari.png">

  <link rel="stylesheet" href="css/home.css">
</head>

<body>

  <div class="home-container">

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="video-wrapper">
      <video class="bg-video" id="bgVideo" autoplay muted loop playsinline poster="img/p1.jpg">
        <source src="video/intro.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SUBTLE VIGNETTE -->
    <div class="home-vignette"></div>

    <!-- BOTTOM ACTION AREA -->
    <main class="home-bottom-area">
      <a href="menu.html" class="enter-menu-btn" id="enterMenuBtn" aria-label="Меню">
        <span class="btn-text">Меню | Menu</span>
      </a>
    </main>

  </div>

  <script>
    // Управление высотой вьюпорта для iOS Safari (динамический 100dvh)
    function setVH() {
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setVH);
    }
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => {
      setTimeout(setVH, 100);
      setTimeout(setVH, 300);
    });

    // Автозапуск видео без звука
    const bgVideo = document.getElementById('bgVideo');
    if (bgVideo) {
      bgVideo.play().catch(() => {});
      document.addEventListener('touchstart', () => {
        if (bgVideo.paused) bgVideo.play().catch(() => {});
      }, { once: true });
    }
  </script>
</body>

</html>
