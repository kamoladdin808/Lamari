<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Mari — Добро пожаловать</title>
  <meta name="description"
    content="Добро пожаловать в La Mari. Полноэкранное живое меню кафе и пекарни: свежая выпечка, завтраки, авторские десерты и кофе.">
  <meta name="keywords"
    content="La Mari, ла мари, меню, кафе, выпечка, десерты, кофе, круассаны, завтраки">
  <meta name="theme-color" content="#9E908B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- Open Graph -->
  <meta property="og:title" content="La Mari — Кафе & Пекарня">
  <meta property="og:description"
    content="Посмотрите наше живое интерактивное меню: вкуснейшие завтраки, кофе, свежая выпечка и авторские блюда.">
  <meta property="og:image" content="img/p1.jpg">
  <link rel="icon" type="image/png" href="img/logo_lamari.png">
  <link rel="apple-touch-icon" href="img/logo_lamari.png">

  <link rel="stylesheet" href="css/home.css">
</head>

<body>

  <div class="home-container">

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="video-wrapper">
      <video class="bg-video" id="bgVideo" autoplay muted loop playsinline poster="img/p1.jpg">
        <source src="video/intro.mp4" type="video/mp4">
      </video>
    </div>

    <div class="veil-top"></div>
    <div class="veil-bottom"></div>

    <!-- TOP BAR -->
    <header class="home-top-bar">
      <div class="home-brand">
        <img src="img/logo_lamari.png" alt="La Mari" class="home-logo">
      </div>
      <div class="header-controls">
        <div class="lang-mobile-btn" id="langMobileBtn">RU</div>
        <div class="lang-switch-desktop">
          <span class="lang-btn active" id="langRu">RU</span>
          <span class="lang-btn" id="langUz">UZ</span>
        </div>
      </div>
    </header>

    <!-- BOTTOM AREA -->
    <main class="home-bottom-area">
      <a href="menu.html" class="enter-menu-btn" id="enterMenuBtn" aria-label="Открыть меню">
        <span class="btn-text" id="btnText">Меню | Menu</span>
        <span class="btn-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </span>
      </a>
    </main>

  </div>

  <!-- LANGUAGE MODAL FOR MOBILE -->
  <div class="lang-overlay" id="langOverlay"></div>
  <div class="lang-modal" id="langModal">
    <div class="lang-modal-handle"></div>
    <div class="lang-modal-header">
      <div id="langModalTitle">Выберите язык / Tilni tanlang</div>
      <button id="closeLang">✕</button>
    </div>
    <div class="lang-modal-body">
      <button class="lang-select-btn active" id="btnSelectRu">Русский язык</button>
      <button class="lang-select-btn" id="btnSelectUz">O'zbek tili</button>
    </div>
  </div>

  <script>
    // 1. Управление динамической высотой вьюпорта для iOS Safari
    function setVH() {
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setVH);
    }
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => {
      setTimeout(setVH, 100);
      setTimeout(setVH, 300);
    });

    // 2. Автозапуск видео
    const bgVideo = document.getElementById('bgVideo');
    if (bgVideo) {
      bgVideo.play().catch(() => {});
      document.addEventListener('touchstart', () => {
        if (bgVideo.paused) bgVideo.play().catch(() => {});
      }, { once: true });
    }

    // 3. Управление языком
    let curLang = localStorage.getItem('lamari_lang') || 'ru';

    const langMobileBtn = document.getElementById('langMobileBtn');
    const langRuBtn = document.getElementById('langRu');
    const langUzBtn = document.getElementById('langUz');
    const btnSelectRu = document.getElementById('btnSelectRu');
    const btnSelectUz = document.getElementById('btnSelectUz');
    const langOverlay = document.getElementById('langOverlay');
    const langModal = document.getElementById('langModal');
    const closeLangBtn = document.getElementById('closeLang');
    const enterMenuBtn = document.getElementById('enterMenuBtn');

    function applyLanguage(lang) {
      curLang = lang;
      localStorage.setItem('lamari_lang', lang);

      langMobileBtn.textContent = lang.toUpperCase();
      langRuBtn.classList.toggle('active', lang === 'ru');
      langUzBtn.classList.toggle('active', lang === 'uz');
      btnSelectRu.classList.toggle('active', lang === 'ru');
      btnSelectUz.classList.toggle('active', lang === 'uz');

      // Передаем выбранный язык параметром при переходе в меню
      enterMenuBtn.href = 'menu.html?lang=' + lang;
    }

    applyLanguage(curLang);

    langRuBtn.onclick = () => applyLanguage('ru');
    langUzBtn.onclick = () => applyLanguage('uz');
    btnSelectRu.onclick = () => { applyLanguage('ru'); closeLangModal(); };
    btnSelectUz.onclick = () => { applyLanguage('uz'); closeLangModal(); };

    function openLangModal() {
      langOverlay.classList.add('open');
      langModal.classList.add('open');
    }

    function closeLangModal() {
      langOverlay.classList.remove('open');
      langModal.classList.remove('open');
    }

    langMobileBtn.onclick = openLangModal;
    langOverlay.onclick = closeLangModal;
    closeLangBtn.onclick = closeLangModal;
  </script>
</body>

</html>
