<body>

  <!-- LUXURY PRELOADER -->
  <div id="preloader">
    <div class="pl-glow"></div>
    <div class="pl-content">
      <img src="img/logo_lamari.png" alt="La Mari" class="pl-logo">
      <div class="pl-track">
        <div class="pl-bar"></div>
      </div>
    </div>
  </div>

  <div class="home-container">

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="video-wrapper">
      <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto">
        <source src="video/video_lamari.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SUBTLE VIGNETTES -->
    <div class="home-top-vignette"></div>
    <div class="home-vignette"></div>

    <!-- TOP BAR (LOGO LEFT, LANGUAGE RIGHT) -->
    <header class="home-top-bar">
      <div class="home-brand">
        <img src="img/logo_lamari.png" alt="La Mari" class="home-logo">
      </div>
      <div class="header-controls">
        <div class="lang-mobile-btn" id="langMobileBtn">RU</div>
        <div class="lang-switch-desktop">
          <span class="lang-btn active" id="langRu">RU</span>
          <span class="lang-btn" id="langUz">UZ</span>
        </div>
      </div>
    </header>

    <!-- BOTTOM ACTION AREA -->
    <main class="home-bottom-area">
      <a href="menu.html" class="enter-menu-btn" id="enterMenuBtn" aria-label="Меню">
        <span class="btn-text" id="enterMenuText">Меню</span>
      </a>

      <!-- CREATOR CREDIT -->
      <a href="https://goldenpixel.uz/" target="_blank" rel="noopener noreferrer" class="home-credit" aria-label="Сделано: Golden Pixel">
        <span class="credit-label" id="creditLabel">Сделано:</span>
        <span class="credit-name">Golden Pixel</span>
        <img src="img/Лого.svg" onerror="this.src='img/golden_pixel_logo.svg'" alt="Golden Pixel" class="credit-logo">
      </a>
    </main>

  </div>

  <!-- LANGUAGE MODAL FOR MOBILE -->
  <div class="lang-overlay" id="langOverlay"></div>
  <div class="lang-modal" id="langModal">
    <div class="lang-modal-handle"></div>
    <div class="lang-modal-header">
      <div id="langModalTitle">Выберите язык / Tilni tanlang</div>
      <button id="closeLang" aria-label="Закрыть">✕</button>
    </div>
    <div class="lang-modal-body">
      <button class="lang-select-btn active" id="btnSelectRu">Русский язык</button>
      <button class="lang-select-btn" id="btnSelectUz">O'zbek tili</button>
    </div>
  </div>

  <script>
    // 1. Динамическая высота вьюпорта для iOS Safari
    function setVH() {
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setVH);
    }
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => {
      setTimeout(setVH, 100);
      setTimeout(setVH, 300);
    });

    // 2. Старт видео строго с начала (с 0.0 сек) после растворения прелоадера
    const bgVideo = document.getElementById('bgVideo');
    const preloader = document.getElementById('preloader');
    const enterMenuBtn = document.getElementById('enterMenuBtn');
    let preloaderDismissed = false;

    // Подготовка первого кадра строго под прелоадером (БЕЗ преждевременного показа)
    if (bgVideo) {
      const prepareFirstFrame = () => {
        try { bgVideo.currentTime = 0; } catch (e) {}
      };
      if (bgVideo.readyState >= 2) {
        prepareFirstFrame();
      } else {
        bgVideo.addEventListener('loadeddata', prepareFirstFrame, { once: true });
        bgVideo.addEventListener('canplay', prepareFirstFrame, { once: true });
      }
    }

    function revealVideo() {
      if (preloaderDismissed) return;
      preloaderDismissed = true;

      if (bgVideo) {
        try {
          bgVideo.currentTime = 0;
        } catch (e) {}
        bgVideo.classList.add('ready');
        bgVideo.play().catch(() => {});
      }

      if (preloader) {
        preloader.classList.add('hide');
      }
    }

    function startPreloader() {
      preloaderDismissed = false;
      if (preloader) {
        preloader.classList.remove('hide');
        preloader.style.display = 'flex';
      }
      if (bgVideo) {
        bgVideo.classList.remove('ready');
        try {
          bgVideo.pause();
          bgVideo.currentTime = 0;
        } catch (e) {}
      }
      setTimeout(revealVideo, 1300);
    }

    // Роскошный прелоадер и синхронный старт видео строго с первого кадра
    window.addEventListener('load', startPreloader);
    setTimeout(revealVideo, 2800);

    // Гарантированный возврат прелоадера при уходе/возврате из меню (BFCache / История)
    window.addEventListener('pagehide', () => {
      if (preloader) {
        preloader.classList.remove('hide');
        preloader.style.display = 'flex';
      }
      if (bgVideo) {
        bgVideo.classList.remove('ready');
        try {
          bgVideo.pause();
          bgVideo.currentTime = 0;
        } catch (e) {}
      }
    });
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        startPreloader();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && bgVideo && bgVideo.paused && preloaderDismissed) {
        bgVideo.play().catch(() => {});
      }
    });

    // 3. Управление языком (синхронизировано с меню и localStorage)
    const translations = {
      ru: {
        menuBtn: 'Меню',
        creditLabel: 'Сделано:',
        creditAria: 'Сделано: Golden Pixel',
        modalTitle: 'Выберите язык',
        closeAria: 'Закрыть'
      },
      uz: {
        menuBtn: 'Menyu',
        creditLabel: 'Tayyorladi:',
        creditAria: 'Tayyorladi: Golden Pixel',
        modalTitle: 'Tilni tanlang',
        closeAria: 'Yopish'
      }
    };

    let curLang = localStorage.getItem('lamari_lang') || 'ru';
    if (curLang !== 'ru' && curLang !== 'uz') curLang = 'ru';

    const enterMenuText = document.getElementById('enterMenuText');
    const creditLabel = document.getElementById('creditLabel');
    const homeCredit = document.querySelector('.home-credit');
    const langModalTitle = document.getElementById('langModalTitle');
    const langMobileBtn = document.getElementById('langMobileBtn');
    const langRuBtn = document.getElementById('langRu');
    const langUzBtn = document.getElementById('langUz');
    const btnSelectRu = document.getElementById('btnSelectRu');
    const btnSelectUz = document.getElementById('btnSelectUz');
    const langOverlay = document.getElementById('langOverlay');
    const langModal = document.getElementById('langModal');
    const closeLangBtn = document.getElementById('closeLang');

    function applyLanguage(lang) {
      curLang = (lang === 'uz') ? 'uz' : 'ru';
      localStorage.setItem('lamari_lang', curLang);
      document.documentElement.lang = curLang;

      const t = translations[curLang];

      if (enterMenuText) enterMenuText.textContent = t.menuBtn;
      if (enterMenuBtn) {
        enterMenuBtn.setAttribute('aria-label', t.menuBtn);
        enterMenuBtn.href = 'menu.html?lang=' + curLang;
      }
      if (creditLabel) creditLabel.textContent = t.creditLabel;
      if (homeCredit) homeCredit.setAttribute('aria-label', t.creditAria);
      if (langModalTitle) langModalTitle.textContent = t.modalTitle;
      if (closeLangBtn) closeLangBtn.setAttribute('aria-label', t.closeAria);

      if (langMobileBtn) langMobileBtn.textContent = curLang.toUpperCase();
      if (langRuBtn) langRuBtn.classList.toggle('active', curLang === 'ru');
      if (langUzBtn) langUzBtn.classList.toggle('active', curLang === 'uz');
      if (btnSelectRu) btnSelectRu.classList.toggle('active', curLang === 'ru');
      if (btnSelectUz) btnSelectUz.classList.toggle('active', curLang === 'uz');
    }

    applyLanguage(curLang);

    if (langRuBtn) langRuBtn.onclick = () => applyLanguage('ru');
    if (langUzBtn) langUzBtn.onclick = () => applyLanguage('uz');
    if (btnSelectRu) btnSelectRu.onclick = () => { applyLanguage('ru'); closeLangModal(); };
    if (btnSelectUz) btnSelectUz.onclick = () => { applyLanguage('uz'); closeLangModal(); };

    function openLangModal() {
      if (langOverlay && langModal) {
        langOverlay.classList.add('open');
        langModal.classList.add('open');
      }
    }

    function closeLangModal() {
      if (langOverlay && langModal) {
        langOverlay.classList.remove('open');
        langModal.classList.remove('open');
      }
    }

    if (langMobileBtn) langMobileBtn.onclick = openLangModal;
    if (langOverlay) langOverlay.onclick = closeLangModal;
    if (closeLangBtn) closeLangBtn.onclick = closeLangModal;

    // 4. Бесшовный мягкий переход в меню без черного экрана
    if (enterMenuBtn) {
      enterMenuBtn.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.style.transition = 'opacity 0.2s ease-out';
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = enterMenuBtn.href;
        }, 190);
      });
    }
  </script>
</body>

</html>
