<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Mari</title>
  <meta name="description" content="Живое меню кафе и пекарни La Mari">
  <meta name="theme-color" content="#0d0b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" href="img/logo_lamari.png">
  <link rel="apple-touch-icon" href="img/logo_lamari.png">

  <link rel="stylesheet" href="css/home.css">
</head>

<body>

  <!-- LUXURY PRELOADER -->
  <div id="preloader">
    <div class="pl-glow"></div>
    <div class="pl-content">
      <img src="img/logo_lamari.png" alt="La Mari" class="pl-logo">
      <div class="pl-track">
        <div class="pl-bar"></div>
      </div>
    </div>
  </div>

  <div class="home-container">

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="video-wrapper">
      <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto" poster="img/p1.jpg">
        <source src="video/video_lamari.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SUBTLE VIGNETTES -->
    <div class="home-top-vignette"></div>
    <div class="home-vignette"></div>

    <!-- TOP BAR (LOGO TOP-LEFT) -->
    <header class="home-top-bar">
      <img src="img/logo_lamari.png" alt="La Mari" class="home-logo">
    </header>

    <!-- BOTTOM ACTION AREA -->
    <main class="home-bottom-area">
      <a href="menu.html" class="enter-menu-btn" id="enterMenuBtn" aria-label="Меню">
        <span class="btn-text">Меню | Menu</span>
      </a>
    </main>

  </div>

  <script>
    // 1. Динамическая высота вьюпорта для iOS Safari
    function setVH() {
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setVH);
    }
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => {
      setTimeout(setVH, 100);
      setTimeout(setVH, 300);
    });

    // 2. Плавный старт видео и бесшовное растворение прелоадера
    const bgVideo = document.getElementById('bgVideo');
    const preloader = document.getElementById('preloader');
    let preloaderDismissed = false;

    function revealVideo() {
      if (preloaderDismissed) return;
      preloaderDismissed = true;
      if (bgVideo) bgVideo.classList.add('ready');
      if (preloader) {
        preloader.classList.add('hide');
      }
    }

    if (bgVideo) {
      bgVideo.play().catch(() => {});

      bgVideo.addEventListener('playing', () => {
        bgVideo.classList.add('ready');
      }, { once: true });

      document.addEventListener('touchstart', () => {
        if (bgVideo.paused) bgVideo.play().catch(() => {});
      }, { once: true });
    }

    // Завершение анимации прелоадера (1.4с) и плавный переход в видео
    window.addEventListener('load', () => {
      setTimeout(revealVideo, 1400);
    });

    // Страховочный таймаут
    setTimeout(revealVideo, 3500);
  </script>
</body>

</html>
